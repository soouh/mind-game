<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="preload" as="image" href="images/workshop-bg-start.png">

<body>

  <div id="opening" class="opening" hidden>
    <div class="opening-art" role="img" aria-label="토끼와 너구리가 공방 오픈을 준비하는 그림"></div>
    <h1 class="opening-title">오픈 준비 중이야!</h1>
    <p class="opening-text">장인이 공방 문을 열기 위해<br>열심히 준비하고 있어! 잠시만 기다려 줘.</p>
    <div class="opening-bar" aria-hidden="true"><span></span></div>
    <p class="opening-loading">로딩 중... (LOADING...)</p>
  </div>
  <header class="site-header">
    <a class="logo" href="index.html">내 마음이 들리니</a>
    <nav aria-label="메뉴">
      <ul class="nav">
        <li><a href="index.html" aria-current="page">공방 입구</a></li>

        <li><a href="play.html">주문하기</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <canvas id="workshop" class="workshop" data-bg="images/workshop-bg-start.png" role="img" aria-label="너구리 장인이 작업대 앞에 서 있는 도트 공방 그림"></canvas>
      <h1>어서 와, 밤티 공방이야!</h1>
      <p>필요한 걸 마음속으로만 떠올려 줘. 몇 가지 주문 질문에 답하면, 20번 안에 딱 그걸 만들어 줄게.</p>
      <div class="hero-actions">
        <a class="btn" href="play.html">주문하러 가기</a>
        <a class="btn btn-plain" href="how.html">이용 방법</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">밤티 공방의 장인은 AI예요. 가끔 엉뚱한 걸 만들어도 너그럽게 봐주세요.</footer>
  <script src="js/workshop.js"></script>
  <script>Workshop.init(document.getElementById("workshop"));</script>

</html>
